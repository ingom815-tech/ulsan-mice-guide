<title>셔틀버스 노선 안내 | 울산국제회의지구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--brown:#A44B23;--brown-deep:#7E3617;--orange:#F58220;--gray-deep:#5B5B63;
    --paper:#FDF9F2;--ink:#2A211B;--ink-soft:#6C5F55;--line:#E9DECF;--radius:14px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;word-break:keep-all;overflow-wrap:break-word;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  [data-lang="en"] .ko{display:none!important}
  [data-lang="ko"] .en{display:none!important}
  header{position:sticky;top:0;z-index:100;height:60px;background:rgba(253,249,242,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-name{display:flex;flex-direction:column;line-height:1.15}
  .brand-name b{font-size:.95rem;font-weight:700}
  .brand-name span{font-size:.55rem;letter-spacing:.13em;color:var(--gray-deep);font-weight:500}
  .lang-toggle{display:flex;border:1.5px solid var(--brown);border-radius:99px;overflow:hidden;font-size:.76rem;font-weight:600;cursor:pointer;user-select:none}
  .lang-toggle span{padding:4px 12px;color:var(--brown)}
  .lang-toggle span.on{background:var(--brown);color:#fff}
  main{max-width:760px;margin:0 auto;padding:34px 18px 70px}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:700;color:var(--brown);margin-bottom:20px}
  .back:hover{color:var(--brown-deep)}
  .ev-head{background:linear-gradient(108deg,#6E2F12,#A44B23 55%,#C4611E);border-radius:var(--radius);color:#fff;padding:24px 24px;box-shadow:0 12px 30px rgba(126,54,23,.25);position:relative}
  .ev-head .dday{position:absolute;top:16px;right:16px;background:#fff;color:var(--brown);font-weight:800;font-size:.76rem;border-radius:99px;padding:5px 14px}
  .ev-head .dday.ongoing{background:var(--orange);color:#fff}
  .ev-head .dday.done{background:rgba(255,255,255,.25);color:#fff}
  .ev-head h1{font-size:clamp(1.15rem,4vw,1.5rem);font-weight:800;line-height:1.35;padding-right:70px}
  .ev-head .meta{margin-top:8px;font-size:.84rem;opacity:.92;font-weight:500}
  h2.page-t{font-size:1.25rem;font-weight:800;margin:30px 0 6px;letter-spacing:-.01em}
  .page-d{font-size:.88rem;color:var(--ink-soft)}
  .guideline{margin-top:18px;border-radius:var(--radius);padding:22px;color:#fff;background:#EB7512}
  .guideline h3{font-size:.95rem;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .guideline ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .guideline li{font-size:.86rem;display:flex;gap:9px;align-items:flex-start;text-shadow:0 1px 3px rgba(120,55,10,.35)}
  .guideline li::before{content:"";flex:0 0 7px;height:7px;margin-top:8px;background:#fff;border-radius:2px;transform:rotate(45deg)}
  .guideline a{color:#fff;font-weight:800;text-decoration:underline;white-space:nowrap}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:16px}
  .card-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.98rem;color:var(--brown);margin-bottom:14px}
  .roundtrip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--orange);border:1.5px solid var(--orange);border-radius:99px;padding:3px 11px;margin-bottom:12px}
  .hflow{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px}
  .hstop{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:600;font-size:.88rem;white-space:nowrap}
  .hstop.hub{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:800}
  .hlink{flex:0 0 auto;width:20px;height:2.5px;margin:0 3px;background:repeating-linear-gradient(to right,var(--orange) 0 5px,transparent 5px 9px)}
  .hours{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:.86rem;font-weight:600}
  .hours svg{color:var(--orange)}
  .sb-map{width:100%;height:300px;border-radius:12px;border:1px solid var(--line);margin-top:14px;z-index:1;position:relative}
  .sb-map.osm-muted .leaflet-tile{filter:grayscale(.75) saturate(.6) brightness(1.06) contrast(.92)}
  .mkr{width:30px;height:30px;border-radius:50%;background:var(--orange);border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(42,33,27,.35)}
  .mkr svg{width:16px;height:16px}
  .mkr-hub{width:36px;height:36px;background:var(--brown);border-width:3px;box-shadow:0 0 0 5px rgba(164,75,35,.18),0 4px 12px rgba(42,33,27,.4)}
  .mkr-hub svg{width:19px;height:19px}
  .map-label{background:#fff;border:1.5px solid var(--brown);border-radius:99px;padding:3px 11px;font-family:'Noto Sans KR',sans-serif;font-size:.74rem;font-weight:700;color:var(--ink);box-shadow:0 2px 8px rgba(42,33,27,.18);white-space:nowrap}
  .map-label.hub{background:var(--brown);color:#fff;border-color:var(--brown)}
  .tt-dir{margin-top:14px}
  .tt-dir b{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
  .tt-dir b svg{color:var(--brown)}
  .tt-times{display:flex;flex-wrap:wrap;gap:7px}
  .tt-chip{background:#fff;border:1.5px solid var(--brown);color:var(--brown);border-radius:9px;padding:6px 13px;font-size:.88rem;font-weight:800}
  .note{margin-top:14px;font-size:.78rem;color:var(--ink-soft)}
  .tba{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.9rem;background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:18px}
  .tba svg{color:var(--orange);flex:0 0 auto}
  .ev-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .ev-item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px;transition:.2s}
  .ev-item:hover{border-color:var(--orange);transform:translateX(3px)}
  .ev-item .d{background:var(--brown);color:#fff;border-radius:9px;padding:6px 11px;font-weight:800;font-size:.86rem;white-space:nowrap}
  .ev-item b{font-size:.94rem;font-weight:700;flex:1}
  .ev-item .st{font-size:.72rem;font-weight:700;color:var(--orange)}
  footer{border-top:1px solid var(--line);padding:22px 18px;text-align:center;font-size:.74rem;color:var(--ink-soft)}
</style>
</head>

<script>
const DOW_KO = ["일","월","화","수","목","금","토"];
function fmtKo(d){ const t=new Date(d+"T00:00:00"); return `${t.getMonth()+1}. ${t.getDate()}.(${DOW_KO[t.getDay()]})`; }
function fmtEn(d){ return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function statusOf(ev, today){
  const s=new Date(ev.s+"T00:00:00"), e=new Date(ev.e+"T00:00:00");
  if(today>e) return {cls:"done", ko:"종료", en:"Ended"};
  if(today>=s) return {cls:"ongoing", ko:"진행중", en:"Now On"};
  const dd=Math.round((s-today)/86400000);
  const t=dd===0?"D-DAY":"D-"+dd;
  return {cls:"upcoming", ko:t, en:t};
}
const BUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6v6M16 6v6M2 12h19.6M4 6h16v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM7 21l1-3M17 21l-1-3"/></svg>';

function guideline(sh){
  const extra = sh ? `
        <li><span class="ko">셔틀버스 노선 : ${sh.stops.map(s=>s.ko).join(" ↔ ")}</span><span class="en">Route: ${sh.stops.map(s=>s.en).join(" ↔ ")}</span></li>
        <li><span class="ko">운행시간 : ${sh.hoursKo}</span><span class="en">Hours: ${sh.hoursEn}</span></li>` : "";
  return `<div class="guideline">
      <h3>${BUS}<span class="ko">이용 안내 사항</span><span class="en">Shuttle Bus Guidelines</span></h3>
      <ul>
        <li><span class="ko">셔틀버스는 무료로 운행됩니다.</span><span class="en">The shuttle bus service is free of charge.</span></li>${extra}
        <li><span class="ko">만석 시 다음 차량을 이용해 주시기 바랍니다.</span><span class="en">If the bus is full, please wait for the next available shuttle.</span></li>
        <li><span class="ko">우천 시에도 정상 운행됩니다.</span><span class="en">The shuttle operates normally in the rain.</span></li>
        <li><span class="ko">문의사항은 <a href="tel:+82529113320">052-911-3320</a>으로 연락해 주세요.</span><span class="en">For inquiries, please contact us at <a href="tel:+82529113320">+82 52-911-3320</a>.</span></li>
      </ul>
    </div>`;
}

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const param = new URLSearchParams(location.search).get("event");
  const ev = EVENTS.find(e=>e.id===param);
  const main = document.getElementById("main");

  if(!ev){
    main.innerHTML = `
      <a class="back" href="index.html">← <span class="ko">메인으로 돌아가기</span><span class="en">Back to Home</span></a>
      <h2 class="page-t"><span class="ko">셔틀버스 노선 안내</span><span class="en">Shuttle Bus Guide</span></h2>
      <p class="page-d"><span class="ko">행사를 선택하면 해당 행사의 셔틀버스 안내를 확인할 수 있습니다.</span><span class="en">Select an event to see its shuttle information.</span></p>
      <div class="ev-list">` +
      [...EVENTS].sort((a,b)=>a.s.localeCompare(b.s)).map(e=>{
        const st = statusOf(e, today);
        return `<a class="ev-item" href="shuttle.html?event=${e.id}">
          <span class="d">${+e.s.slice(5,7)}/${+e.s.slice(8,10)}</span>
          <b><span class="ko">${e.ko}</span><span class="en">${e.en}</span></b>
          <span class="st"><span class="ko">${st.ko}</span><span class="en">${st.en}</span></span>
        </a>`;
      }).join("") + `</div>`;
    return;
  }

  const st = statusOf(ev, today);
  const dateKo = ev.s===ev.e ? fmtKo(ev.s) : `${fmtKo(ev.s)} ~ ${fmtKo(ev.e)}`;
  const dateEn = ev.s===ev.e ? fmtEn(ev.s) : `${fmtEn(ev.s)} – ${fmtEn(ev.e)}`;
  const sh = ev.shuttle;

  let body;
  if(!sh){
    body = `<div class="card">
      <div class="card-t">${BUS}<span class="ko">셔틀버스</span><span class="en">Shuttle Bus</span></div>
      <div class="tba">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span><span class="ko">이 행사의 셔틀버스 운행 정보는 확정되는 대로 안내됩니다.</span><span class="en">Shuttle information for this event will be announced once confirmed.</span></span>
      </div>
    </div>`;
  } else {
    const flow = sh.stops.map((s,i)=>
      (i?'<span class="hlink" aria-hidden="true"></span>':'') +
      `<span class="hstop${s.hub?" hub":""}"><span class="ko">${s.ko}</span><span class="en">${s.en}</span></span>`).join("");
    const table = sh.table.map(d=>`<div class="tt-dir">
        <b><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="ko">${d.dko}</span><span class="en">${d.den}</span></b>
        <div class="tt-times">${d.t.map(t=>`<span class="tt-chip">${t}</span>`).join("")}</div>
      </div>`).join("");
    body = `
    <div class="card">
      <div class="card-t"><span class="ko">노선</span><span class="en">Route</span></div>
      <div class="roundtrip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg><span class="ko">왕복 운행</span><span class="en">Round-trip service</span></div>
      <div class="hflow">${flow}</div>
      <div class="sb-map" id="shMap" aria-label="노선 지도"></div>
    </div>
    <div class="card">
      <div class="card-t"><span class="ko">운행시간</span><span class="en">Operating Hours</span></div>
      <div class="hours"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="ko">${sh.hoursKo}</span><span class="en">${sh.hoursEn}</span></div>
    </div>
    <div class="card">
      <div class="card-t"><span class="ko">셔틀버스 시간표</span><span class="en">Timetable</span></div>
      ${table}
      <p class="note"><span class="ko">※ 예상 시간표이며, 행사 사정에 따라 변경될 수 있습니다.</span><span class="en">※ Timetable is tentative and subject to change.</span></p>
    </div>`;
  }

  main.innerHTML = `
    <a class="back" href="index.html">← <span class="ko">메인으로 돌아가기</span><span class="en">Back to Home</span></a>
    <div class="ev-head">
      <span class="dday ${st.cls}"><span class="ko">${st.ko}</span><span class="en">${st.en}</span></span>
      <h1><span class="ko">${ev.ko}</span><span class="en">${ev.en}</span></h1>
      <div class="meta"><span class="ko">${dateKo} · ${ev.vko}</span><span class="en">${dateEn} · ${ev.ven}</span></div>
    </div>
    <h2 class="page-t"><span class="ko">셔틀버스 노선 안내</span><span class="en">Shuttle Bus Guide</span></h2>
    ${guideline(sh)}
    ${body}`;
}

function initMap(sh){
  if(typeof L === "undefined" || !sh) return;
  const el = document.getElementById("shMap");
  if(!el) return;
  const MKR = {
    hub:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>',
    train:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21l2-4M16 21l-2-4"/></svg>'
  };
  const m = L.map(el, {scrollWheelZoom:false});
  let errs=0, fell=false;
  const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>', maxZoom:19, subdomains:"abcd"});
  carto.on("tileerror", ()=>{
    if(++errs>=3 && !fell){ fell=true; m.removeLayer(carto);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19}).addTo(m);
      el.classList.add("osm-muted"); }
  });
  carto.addTo(m);
  const pts=[];
  sh.stops.forEach(s=>{
    pts.push(s.c);
    const size = s.hub?36:30;
    const icon = L.divIcon({className:"", html:`<div class="mkr${s.hub?" mkr-hub":""}">${MKR[s.icon]||MKR.train}</div>`, iconSize:[size,size], iconAnchor:[size/2,size/2]});
    const dir = s.dir||"top";
    const off = dir==="bottom"?[0,18]:dir==="left"?[-18,0]:dir==="right"?[18,0]:[0,-18];
    L.marker(s.c,{icon}).addTo(m)
      .bindTooltip(`<span class="map-label${s.hub?" hub":""}"><span class="ko">${s.ko}</span><span class="en">${s.en}</span></span>`,
        {permanent:true, direction:dir, offset:off, className:"map-tt"});
  });
  m.fitBounds(L.latLngBounds(pts).pad(0.35));
  (async ()=>{
    try{
      const co = pts.map(p=>p[1]+","+p[0]).join(";");
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${co}?overview=full&geometries=geojson`);
      if(!r.ok) throw 0;
      const j = await r.json();
      const road = j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
      L.polyline(road,{color:"#fff",weight:7,opacity:.95}).addTo(m);
      L.polyline(road,{color:"#A44B23",weight:4,opacity:.95}).addTo(m);
      m.fitBounds(L.latLngBounds(road.concat(pts)).pad(0.12));
    }catch(e){
      L.polyline(pts,{color:"#A44B23",weight:3.5,opacity:.85,dashArray:"7 7"}).addTo(m);
    }
  })();
  const st=document.createElement("style");
  st.textContent=".map-tt{background:transparent;border:none;box-shadow:none;padding:0}.map-tt::before{display:none}";
  document.head.appendChild(st);
}

render();
if(typeof EVENTS!=="undefined"){ const p=new URLSearchParams(location.search).get("event"); const e=EVENTS.find(x=>x.id===p); if(e&&e.shuttle) initMap(e.shuttle); }

document.querySelectorAll("[data-set-lang]").forEach(el=>{
  const set=()=>{
    document.body.dataset.lang=el.dataset.setLang;
    document.documentElement.lang=el.dataset.setLang;
    document.querySelectorAll("[data-set-lang]").forEach(x=>x.classList.toggle("on",x===el));
  };
  el.addEventListener("click",set);
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set();}});
});
</script>
</body>
</html>
